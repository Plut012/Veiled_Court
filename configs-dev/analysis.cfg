# KataGo Analysis Engine config — post-game review
# Dev variant (KITSUNE_CONFIG_DIR=configs-dev): low visits so reviews finish
# quickly on CPU / small GPUs. Production config is configs/analysis.cfg.

# Logs
logDir = analysis_logs

# Analysis
reportAnalysisWinratesAs = BLACK

# Search limits — 50 visits: rough but fast; enough to test the review flow
maxVisits = 50

# Threading — batch many positions in parallel
numAnalysisThreads = 8
numSearchThreadsPerAnalysisThread = 2

# GPU batching
nnMaxBatchSize = 64

# Cache
nnCacheSizePowerOfTwo = 23
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
