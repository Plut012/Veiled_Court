<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Review - Spirit Animals</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body class="theme-dragon">
  <div id="review-screen">
    <div id="board-container">
      <canvas id="board"></canvas>
    </div>

    <div id="verdict"></div>

    <div id="timeline">
      <div id="timeline-bar">
        <div id="timeline-fill"></div>
      </div>
    </div>

    <div id="nav">
      <button id="nav-left" aria-label="Previous move">&#8592;</button>
      <button id="nav-right" aria-label="Next move">&#8594;</button>
    </div>

    <a id="nav-done" href="/">New Game</a>
  </div>

  <script src="js/board.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
