<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0E0B1A">
  <link rel="manifest" href="manifest.json">
  <title>The Court</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body class="theme-dragon">
  <div id="loading-overlay">
    <div id="loading-spirit"></div>
  </div>

  <div id="game-screen">
    <div id="spirit-name"></div>
    <div id="turn-line-top" class="turn-line"></div>

    <div id="board-container">
      <canvas id="board"></canvas>
    </div>

    <div id="turn-line-bottom" class="turn-line"></div>

    <div id="submit-bar" style="display:none"></div>

    <div id="controls">
      <button id="pass-btn">Pass</button>
      <button id="resign-btn">Resign</button>
    </div>

    <div id="game-over" style="display:none"></div>

    <div id="info" style="display:none">
      <span id="move-count"></span>
      <span id="current-turn"></span>
      <span id="last-move"></span>
    </div>
  </div>

  <script src="js/board.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
