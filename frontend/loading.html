<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0E0B1A">
  <title>The Court</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--board-primary);
      color: var(--accent);
      font-family: 'Cormorant Garamond', Georgia, serif;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    body.leaving { opacity: 0; }

    /* Progress bar — thin line across top, only while the pod wakes */
    #progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent);
      opacity: 0;
      transition: width 0.8s ease-out, opacity 0.8s ease;
    }

    #progress.on { opacity: 0.6; }

    .message {
      text-align: center;
      width: 100%;
      max-width: 22rem;
      opacity: 0;
      animation: emerge 1s ease-out 0.3s forwards;
    }

    .spirit-name {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      margin-bottom: 1.5rem;
    }

    /* The stage holds one line at a time: the word, the status, or a farewell */
    .stage { min-height: 2.5rem; }

    .line { display: none; }
    .line.shown { display: block; animation: emerge 0.8s ease-out both; }

    #word input {
      width: 100%;
      max-width: 14rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--accent);
      border-radius: 0;
      outline: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 1.1rem; /* ≥16px so mobile browsers don't zoom */
      font-style: italic;
      letter-spacing: 0.2em;
      text-align: center;
      padding: 0.25rem 0;
      opacity: 0.7;
      transition: opacity 0.4s ease;
      caret-color: var(--accent);
    }

    #word input::placeholder { color: var(--accent); opacity: 0.45; letter-spacing: 0.08em; }
    #word input:focus { opacity: 1; }

    #word.shiver { animation: shiver 0.45s ease-in-out; }
    #word.dissolve { display: block; animation: dissolve 0.7s ease-in forwards; }

    .status {
      font-size: 0.95rem;
      font-style: italic;
      opacity: 0.5;
    }

    #status.shown { animation: emerge 0.8s ease-out both, breathe 3s ease-in-out 0.8s infinite; }

    #farewell a {
      display: inline-block;
      margin-top: 1rem;
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      opacity: 0.55;
    }

    #farewell a:hover, #farewell a:focus { opacity: 1; }

    @keyframes emerge {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    @keyframes shiver {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(1px); }
    }

    @keyframes dissolve {
      to { opacity: 0; filter: blur(4px); letter-spacing: 0.4em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="progress"></div>

  <div class="message">
    <div class="spirit-name" id="spirit-name"></div>
    <div class="stage">
      <form id="word" class="line" autocomplete="off">
        <input id="word-input" type="password" placeholder="speak the word"
               aria-label="speak the word" enterkeyhint="go"
               autocapitalize="off" autocorrect="off" spellcheck="false">
      </form>
      <div id="status" class="line status">waking…</div>
      <div id="farewell" class="line status">
        <div id="farewell-text"></div>
        <a href="/index.html">return to the court</a>
      </div>
    </div>
  </div>

  <script>
    // Game config comes in as URL params — forwarded to the game page
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme');
    if (theme) document.body.classList.add(theme);

    const names = {
      crane: 'Tsuru', eagle: 'Garuda', lion: 'Sekhmet',
      praying_mantis: 'Cǎotáng', spider: 'Anansi', crow: 'Morrígan',
      jaguar: 'Balam', dragon: 'Ryūjin', mantis_shrimp: 'Zhìyǎn',
    };
    document.getElementById('spirit-name').textContent = names[params.get('spirit')] || '';

    const word = document.getElementById('word');
    const input = document.getElementById('word-input');
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('progress');

    const WORD_KEY = 'courtWord';
    const GIVE_UP_MS = 10 * 60 * 1000;

    function storedWord() {
      try { return localStorage.getItem(WORD_KEY) || ''; } catch (e) { return ''; }
    }
    function rememberWord(w) {
      try { w ? localStorage.setItem(WORD_KEY, w) : localStorage.removeItem(WORD_KEY); } catch (e) {}
    }

    function show(id) {
      document.querySelectorAll('.line').forEach(el => el.classList.toggle('shown', el.id === id));
    }

    // POST /summon. Outcomes: ok (with data), wrong, busy (no GPU), local, error.
    // "local" = no coordinator (run-local.sh: the Rust server serves this page, /summon 404/405).
    async function summon(password) {
      let resp;
      try {
        resp = await fetch('/summon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
      } catch (e) {
        return { kind: 'local' };
      }
      if (resp.status === 401) return { kind: 'wrong' };
      if (resp.status === 503) return { kind: 'busy' };
      if (resp.status === 404 || resp.status === 405) return { kind: 'local' };
      if (!resp.ok) return { kind: 'error' };
      try {
        return { kind: 'ok', data: await resp.json() };
      } catch (e) {
        return { kind: 'local' };
      }
    }

    function enter(podUrl) {
      const next = new URLSearchParams(params);
      if (podUrl) next.set('pod', podUrl);
      bar.style.width = '100%';
      document.body.classList.add('leaving');
      setTimeout(() => { window.location.href = '/game.html?' + next; }, 600);
    }

    function farewell(text) {
      bar.classList.remove('on');
      document.getElementById('farewell-text').textContent = text;
      show('farewell');
    }

    function handle(result, password) {
      if (result.kind === 'ok' || result.kind === 'busy') rememberWord(password);
      switch (result.kind) {
        case 'local':
          return enter(null);
        case 'ok':
          if (result.data.ready && result.data.url) return enter(result.data.url);
          return wake();
        case 'busy':
          return farewell('no spirit can be roused just now — try again soon');
        default:
          return farewell('the court is silent — try again soon');
      }
    }

    // ── the word ──

    function askForWord() {
      show('word');
      input.focus();
    }

    let speaking = false;
    word.addEventListener('submit', async (e) => {
      e.preventDefault();
      const w = input.value.trim();
      if (!w || speaking) return;
      speaking = true;
      const result = await summon(w);
      speaking = false;

      if (result.kind === 'wrong') {
        input.value = '';
        word.classList.remove('shiver');
        void word.offsetWidth; // restart the animation
        word.classList.add('shiver');
        input.focus();
        return;
      }

      input.blur();
      word.classList.add('dissolve');
      setTimeout(() => {
        word.classList.remove('dissolve');
        handle(result, w);
      }, 700);
    });

    // ── waking ──

    function wake() {
      show('status');
      bar.classList.add('on');

      const phrases = ['waking…', 'stirring…', 'the board warms…', 'almost here…'];
      let progress = 5;
      let phraseIdx = 0;
      bar.style.width = progress + '%';

      const tick = setInterval(() => {
        if (progress < 85) {
          progress += Math.random() * 8 + 2;
          bar.style.width = Math.min(progress, 85) + '%';
        }
        phraseIdx = (phraseIdx + 1) % phrases.length;
        statusEl.textContent = phrases[phraseIdx];
      }, 4000);

      const started = Date.now();
      const poll = setInterval(() => {
        if (Date.now() - started > GIVE_UP_MS) {
          clearInterval(poll);
          clearInterval(tick);
          farewell('the spirit did not wake — try again later');
          return;
        }
        fetch('/status').then(r => r.json()).then(data => {
          if (data.ready && data.url) {
            clearInterval(poll);
            clearInterval(tick);
            statusEl.textContent = 'entering…';
            enter(data.url);
          }
        }).catch(() => {});
      }, 2500);
    }

    // ── begin: try the remembered word (or none — that also detects run-local) ──

    (async () => {
      const remembered = storedWord();
      const result = await summon(remembered);
      if (result.kind === 'wrong') {
        if (remembered) rememberWord('');
        return askForWord();
      }
      handle(result, remembered);
    })();
  </script>
</body>
</html>
