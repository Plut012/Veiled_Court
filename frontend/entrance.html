<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Veiled Court</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0E0B1A;
      color: #D4C4A0;
      font-family: 'Cormorant Garamond', serif;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .veil {
      text-align: center;
      opacity: 0;
      animation: emerge 2s ease-out 0.5s forwards;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
    }

    .breath {
      font-size: 0.9rem;
      font-style: italic;
      opacity: 0.5;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes emerge {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .fade-out {
      animation: dissolve 0.6s ease-in forwards;
    }

    @keyframes dissolve {
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="veil">
    <h1>The Court</h1>
    <p class="breath">touch to enter</p>
  </div>

  <script>
    let entered = false;
    document.body.addEventListener('click', enter);
    document.body.addEventListener('touchstart', enter);

    function enter() {
      if (entered) return;
      entered = true;
      document.querySelector('.veil').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 600);
    }
  </script>
</body>
</html>
